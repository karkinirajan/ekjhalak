<!--
  brand/mark-small.svg — the same mark for 16 and 32 pixel rendering.

  The shoulder peak and the horizon rule both disappear into mud below about
  forty pixels, so at those sizes they are gone. What is left is one peak and
  its lit tip, drawn heavier: the same idea, said in fewer strokes, which is
  what a favicon is for.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EkJhalak">
  <rect width="64" height="64" rx="14" fill="#1877f2"/>
  <path d="M8 48 L32 16 L56 48 Z" fill="#ffffff"/>
  <path d="M32 16 L42 29.5 L22 29.5 Z" fill="#f7b928"/>
</svg>
