<!--
  brand/mark.svg — the EkJhalak mark.

  Drawn from the masthead in components/brand-banner.tsx rather than invented
  beside it: the range, the horizon, and the one summit catching light. That
  summit is the whole idea of the name — एक झलक, a glimpse — and it is the only
  part of the masthead that still reads at sixteen pixels, which is why it is
  the part the icon keeps.

  The tile is the brand blue. The range is white, flat, with no gradient and no
  shadow, because an icon is a silhouette at the size it is actually used. The
  lit tip is the amber the topic palette uses for business; it is the single
  warm note in a cold mark, and it is what makes this a sunrise rather than a
  logo of a mountain.

  Geometry is on a 64 unit grid so every coordinate lands on a whole or half
  pixel at 16, 32, 64, 128, 256 and 512.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EkJhalak">
  <rect width="64" height="64" rx="14" fill="#1877f2"/>
  <!-- The range: one lead summit and one shoulder. Rounded joins, because a
       mark with needle-sharp corners reads as a warning sign. -->
  <g stroke-linejoin="round" stroke-width="2.4">
    <path d="M11 41 L23 25 L30 33 L40 18 L53 41 Z" fill="#ffffff" stroke="#ffffff"/>
    <!-- First light on the lead summit: the glimpse the name is about. -->
    <path d="M40 18 L46.5 29.5 L33.5 29.5 Z" fill="#f7b928" stroke="#f7b928"/>
  </g>
  <!-- Two dispatches below the horizon — a headline and the line under it.
       This is the half of the mark that says "news" rather than "Nepal", and
       the reason the icon is not simply a mountain. -->
  <rect x="11" y="47" width="42" height="3.2" rx="1.6" fill="#ffffff"/>
  <rect x="11" y="53.5" width="27" height="3.2" rx="1.6" fill="#ffffff" fill-opacity="0.55"/>
</svg>
