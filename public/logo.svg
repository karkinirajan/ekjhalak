<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="96" fill="url(#g1)"/>
  <!-- Abstract eye / lens motif -->
  <ellipse cx="100" cy="100" rx="56" ry="36" fill="none" stroke="white" stroke-width="8" opacity="0.9"/>
  <!-- Inner pupil -->
  <circle cx="100" cy="100" r="18" fill="white" opacity="0.95"/>
  <circle cx="100" cy="100" r="11" fill="url(#g2)"/>
  <!-- Top accent line -->
  <path d="M44 100 Q100 48 156 100" stroke="white" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
