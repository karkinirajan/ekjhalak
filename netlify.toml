# netlify.toml
# Netlify's build configuration, in the repo rather than only in the dashboard.
#
# The settings here were previously set in the Netlify UI, which meant a commit
# could not be reviewed alongside the build that would run it, and a change made
# in the dashboard left no trace in history. Values set here win over the UI.

[build]
  # `--webpack`, not Turbopack.
  #
  # Next.js 16 builds with Turbopack by default, and the Netlify Next Runtime
  # (v5.16.2) cannot resolve Turbopack's internal font module. Every build died
  # with 28 copies of:
  #
  #   Module not found: Can't resolve
  #   '@vercel/turbopack-next/internal/font/google/font'
  #
  # — one per @font-face that next/font/google generates for Inter, Source Serif
  # and Mukta. Nothing in app/layout.tsx was wrong; the bundler simply is not
  # supported by the runtime that has to deploy its output.
  #
  # Measured locally: `next build --webpack` completes and emits the same 16
  # routes. `pnpm run build:turbo` keeps the fast path available for local work,
  # where no Netlify runtime is involved.
  #
  # Revisit when the Netlify Next Runtime announces Turbopack support — this is
  # a compatibility pin, not a preference.
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  # Pinned so a Netlify image upgrade cannot move Node underneath the build.
  # 22 matches the version .github/workflows/ci.yml tests against; a build that
  # passes CI on one major and ships on another is a gap, not a convenience.
  NODE_VERSION = "22"
  # Corepack reads `packageManager` from package.json, so the pnpm version is
  # declared in exactly one place.
  NETLIFY_USE_PNPM = "true"

  # Secrets scanning: which variables are not secrets.
  #
  # Netlify scans the repo and the build output for the *value* of every
  # environment variable and fails the build on a match. That is the right
  # default, and it is why the genuinely sensitive names are deliberately absent
  # from this list: GROQ_API_KEY, RESEND_API_KEY, SUPABASE_SERVICE_ROLE_KEY,
  # DATABASE_URL, CRON_SECRET, REVALIDATE_SECRET and NEWSLETTER_SECRET are all
  # still scanned, and must stay that way.
  #
  # The names below are configuration, not credentials — timing budgets, batch
  # sizes, a model name, a publish policy and the public site URL. Several are
  # small integers, and a small integer matches *as a substring* almost
  # everywhere. The deploy that made this necessary failed on GROQ_BUDGET_MS,
  # whose value is 25000, matched inside the Lighthouse timings
  # `73.42500000000001` and `773.0250000022352` in audit/baseline — numbers with
  # no relationship to it at all. It was also "found" in a webpack cache pack
  # and in the Deno standard library vendored by Netlify's own Next.js plugin.
  #
  # The model-name variables are here for the same reason. "openai/gpt-oss-120b"
  # appears in build output wherever the default chain is inlined, so a deploy
  # that sets GROQ_MODEL_SUMMARY to that value would fail the scan on its own
  # default. The two EKJHALAK_*_MODEL aliases are listed alongside them.
  #
  # The Gemini model names join them, and that deploy is worth recording: the
  # scan reported GEMINI_MODEL_TRANSLATE "leaking" into the webpack cache six
  # times. What it had found was the string "gemini-3.1-flash-lite" — a literal
  # constant in lib/summarizer.ts, which is the model's public name and the same
  # value the variable holds. Nothing leaked; a model name matched itself.
  #
  # EKJHALAK_SUMMARY, EKJHALAK_TRANSLATION and GEMINI_API_KEY are deliberately
  # NOT here: those are API keys, and they stay scanned.
  #
  # Omitting the keys rather than the paths, because the paths are incidental:
  # the next build would find 25000 somewhere else. Omitting the key says the
  # true thing, which is that this value was never a secret.
  SECRETS_SCAN_OMIT_KEYS = "AGGREGATE_BUDGET_MS,GROQ_BUDGET_MS,EXTRACT_BUDGET_MS,VERIFY_BUDGET_MS,GROQ_BATCH_SIZE,GROQ_CONCURRENCY,GROQ_MODEL,GROQ_MODEL_SUMMARY,GROQ_MODEL_TRANSLATE,EKJHALAK_SUMMARY_MODEL,EKJHALAK_TRANSLATION_MODEL,GEMINI_MODEL_SUMMARY,GEMINI_MODEL_TRANSLATE,OPENROUTER_MODEL_SUMMARY,OPENROUTER_MODEL_TRANSLATE,OPENROUTER_DAILY_REQUEST_BUDGET,OPENROUTER_MINUTE_REQUEST_LIMIT,OPENROUTER_SITE_URL,OPENROUTER_APP_TITLE,GROQ_DAILY_TOKEN_BUDGET,GROQ_MAX_BATCHES_PER_PASS,PUBLISH_POLICY,NEXT_PUBLIC_SITE_URL,NEWSLETTER_FROM,NEWSLETTER_REPLY_TO,DIGEST_MAX_STORIES,DIGEST_BUDGET_MS"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Security headers ─────────────────────────────────────────────────────────
#
# next.config.ts already sets these through Next's `headers()`, and on Netlify
# that covers rendered routes. It does not cover responses Netlify serves
# directly — static assets out of the CDN, and anything the runtime short
# circuits — so the baseline is repeated here at the edge.
#
# Deliberately a subset: only the headers that are safe to apply to every
# response regardless of content type. The full CSP stays in next.config.ts,
# where it can vary by route.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Next.js emits content-hashed filenames under /_next/static, so those are
# immutable for as long as they exist. Anything else keeps whatever
# Cache-Control the framework chose for it.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
