name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI used to run `npm ci` against a package-lock.json while Vercel built
      # the same commit with pnpm, so the two resolved dependencies
      # independently and a green run here said nothing about the deploy.
      # pnpm-lock.yaml is now the only lockfile in the repo, and this matches it.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Was `npx tsc --noEmit`, which uses tsconfig.json — a different set of
      # files from the tsconfig.typecheck.json the repo's own script targets.
      - name: Type-check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # Parses the real token values out of globals.css and checks every colour
      # pairing the UI paints. The palette previously shipped with six WCAG AA
      # failures under a comment asserting it had been verified.
      - name: Contrast (WCAG AA)
        run: pnpm run check:contrast

      # Dependency advisories. Three highs (sharp, nanoid, js-yaml) and four
      # postcss advisories were open in the tree with nothing in CI to say so;
      # they are pinned in pnpm-workspace.yaml, and this is what keeps them
      # pinned. `--audit-level=high` rather than `low` so a moderate advisory
      # in a build-time package does not block a newsroom's deploy at 6am —
      # raise it once the tree is quiet enough to stay that way.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm run build
        env:
          # Stub values so the build does not fail on missing env vars.
          #
          # The apex, not www. lib/site-url.ts defaults to the apex and explains
          # why at length — www.ekjhalak.news 301s to it, so publishing www
          # canonicals puts a redirect in front of every URL the site says is
          # canonical. CI was building with www anyway, which contradicted the
          # one place that address is supposed to be written down. It never
          # showed up because the SEO gate that checks it did not run: the job
          # was failing at `pnpm install` long before this step.
          NEXT_PUBLIC_SITE_URL: https://ekjhalak.news
          REVALIDATE_SECRET: stub
          CRON_SECRET: stub
          # GROQ_API_KEY is deliberately absent. With no key the enrichment
          # pass is skipped entirely, so the build stays fast and deterministic
          # and CI never spends the project's daily model quota. A stub value
          # would be worse than none: it would send real requests that 401.
          # (This said GEMINI_API_KEY until the pipeline moved to Groq.)

      # Everything above this line checks source. This checks the running site,
      # which is where a whole class of failure lives: `next start` refused to
      # boot on an images.remotePatterns list that had compiled cleanly, and axe
      # found a 1.6:1 contrast failure on the 404 page that check-contrast
      # structurally cannot see, because the ratio was broken by an opacity
      # utility sitting on top of a passing token pair.
      #
      # One step rather than three. The server is a background process and a job
      # step is its own shell, so starting it in one step and depending on it in
      # the next is the kind of thing that works until it doesn't. Start, use and
      # stop in one place: the dependency is explicit, and the trap releases the
      # port even when a check fails.
      #
      # NEXT_PUBLIC_SITE_URL matches the build. Story pages are `force-dynamic`
      # and read it again at request time, so a different origin here would have
      # the pages and the sitemap disagreeing about what this site is called —
      # the exact failure lib/site-url.ts exists to prevent.
      - name: Accessibility and SEO against the running site
        env:
          NEXT_PUBLIC_SITE_URL: https://ekjhalak.news
        run: |
          set -euo pipefail

          pnpm run start &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000/ || {
            echo "::error::production server did not come up on :3000"
            exit 1
          }

          # Every route, not just the homepage. The 404 page was the one
          # carrying a contrast failure, and it is the page least likely to be
          # opened by hand.
          for route in / /about /contact /editorial-standards /privacy /terms /nonexistent-page; do
            echo "── $route"
            node scripts/axe-scan.mjs "http://localhost:3000$route"
          done

          pnpm run check:seo http://localhost:3000
