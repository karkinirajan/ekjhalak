server {
    listen 80 default_server;
    server_name ekjhalak.news www.ekjhalak.news _;

    # The app sets X-Frame-Options, X-Content-Type-Options, Referrer-Policy and
    # Permissions-Policy itself, in next.config.ts. Repeating them here produced
    # every one of them twice on every response. HSTS is the exception: it is
    # added by certbot with the TLS block, since promising HTTPS over plain HTTP
    # is a promise this server cannot keep yet.

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        # Next emits content-hashed filenames here, so they are immutable for as
        # long as they exist.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # lib/rate-limit.ts reads the first entry of this header. Without it
        # every visitor shares one bucket and the limiter does nothing.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # A cold pass measured 17s. The default 60s is thin on a slow fetch.
        proxy_read_timeout 90s;
    }
}
