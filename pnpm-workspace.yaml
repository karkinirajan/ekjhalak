# Packages allowed to run install scripts.
#
# pnpm 11 refuses to run a dependency's postinstall unless it is named here, and
# exits non-zero rather than skipping quietly — which is what failed CI at the
# install step, before a single check had run. The stub pnpm writes says
# "set this to true or false"; leaving that in place is the same as not
# answering, so each one is decided below.
#
# All three genuinely need their scripts, and all three would fail loudly rather
# than subtly without them:
#
#   esbuild        fetches the platform-specific binary. `tsx` runs the test
#                  suite through it, so no binary means no tests.
#   sharp          links libvips. This is what next/image uses to resize the
#                  publisher photographs; without it image optimisation falls
#                  back or fails at runtime, in production only.
#   unrs-resolver  napi bindings for the TypeScript import resolver that
#                  eslint-config-next uses.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# Transitive-dependency pins.
#
# All three are advisories against packages this project does not depend on
# directly and cannot upgrade by bumping its own dependency:
#
#   sharp    < 0.35.0  — inherited libvips CVEs (CVE-2026-33327 / -33328 /
#                        -35590 / -35591), reached through `next`. This is the
#                        one with real runtime exposure: sharp is what optimises
#                        the remote photographs the RSS feeds supply, so it
#                        processes untrusted image bytes on every cache miss.
#   nanoid   < 3.3.18  — unbounded loop for a zero `size`, reached through
#                        postcss. Build-time only.
#   js-yaml  < 4.3.1   — quadratic CPU on `!!omap`, reached through eslint.
#                        Lint-time only.
#   postcss  < 8.5.23  — four advisories, the worst an arbitrary file read via
#                        an attacker-controlled `sourceMappingURL`. `next`
#                        vendors 8.4.31 while @tailwindcss/postcss already
#                        resolves 8.5.25, so without this the tree carries two
#                        copies and builds with the old one. Build-time only:
#                        the only CSS postcss sees here is ours.
#
# Pinned rather than left to float because `pnpm audit` is a CI gate now, and a
# lockfile that satisfies it today should keep satisfying it on a fresh install.
# Drop an entry once the upstream package ships a release that already resolves
# past it.
overrides:
  sharp: ">=0.35.4"
  nanoid: ">=3.3.18"
  js-yaml: ">=4.3.1"
  postcss: ">=8.5.23"
